name: AI

on:
  # PR은 경로와 상관없이 돌린다. 필수 상태 체크로 걸어도 문서만 바꾼 PR이 대기에 걸리지 않는다.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'AI/**'
      - '.github/workflows/ai.yml'

permissions:
  contents: read

concurrency:
  # main 푸시는 실행마다 별도 그룹이다. 같은 그룹이면 대기 중인 실행이 새 실행에 밀려 커밋 하나가 검사되지 않는다.
  group: ai-${{ github.event_name == 'push' && github.run_id || github.ref }}
  # PR에서만 앞 실행을 취소한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AI
    steps:
      # 액션은 태그가 아니라 커밋 SHA로 고정한다. 올릴 때는 손으로 바꾼다(Dependabot 없음).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # uv 버전은 AI/uv.lock을 만든 버전과 맞춘다. Python 버전은 uv가 AI/.python-version에서 읽어 받는다.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: AI/uv.lock
      # lint → format 확인 → typecheck → test. 로컬과 같은 스크립트를 돌린다.
      - run: ./verify.sh
